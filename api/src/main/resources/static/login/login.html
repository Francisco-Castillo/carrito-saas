<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Carrito SaaS - Login</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="login.css">

</head>

<body>

<div class="background"></div>

<div class="login-container">

  <div class="login-card fade-in">

    <!-- HEADER -->
    <div class="header">
      <div class="logo">🍔</div>
      <h1>Carrito SaaS</h1>
      <p class="subtitle">Panel de gestión para foodtrucks</p>
    </div>

    <!-- RESTAURANTE -->
    <div class="restaurant-box">
      <span class="restaurant-label">Restaurante</span>
      <span class="restaurant-name" id="restaurantName">Cargando...</span>
    </div>

    <!-- FORM -->
    <form id="loginForm">

      <div class="input-group">
        <span class="icon">👤</span>
        <input type="text" id="username" placeholder="Usuario" required>
      </div>

      <div class="input-group">
        <span class="icon">🔒</span>
        <input type="password" id="password" placeholder="Contraseña" required>
      </div>

      <!-- RECORDAR -->
      <div class="options">
        <label>
          <input type="checkbox" id="rememberMe">
          Recordarme
        </label>
      </div>

      <button class="login-btn" id="loginBtn">
        <span class="btn-text">Iniciar sesión</span>
        <div class="loader"></div>
      </button>

      <!-- ERROR -->
      <div id="errorMessage" class="error"></div>

    </form>

    <!-- FOOTER -->
    <div class="footer">
      <p>© 2026 Carrito SaaS</p>
      <span class="powered">Powered by SDE Group</span>
    </div>

  </div>

</div>

<script src="login.js"></script>

</body>
</html>

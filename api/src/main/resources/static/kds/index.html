<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<title>KDS - Cocina</title>

<link rel="stylesheet" href="kds.css">

<link
	href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
	rel="stylesheet">

<script>
// El rol lo valida el servidor (403 en la API): este guard solo cubre la
// ausencia de una sesión usable. Nunca lanza y nunca deja la página corriendo
// sin sesión: si falla la lectura del slug o del token (almacenamiento
// bloqueado, modo privado), cae al redirect de todos modos. Sin slug legible
// redirige sin él, con él conserva el restaurante.
(function () {
    let target = "/login/login.html";
    try {
        const slug = new URLSearchParams(window.location.search).get("restaurant");
        if (slug) {
            target += "?restaurant=" + encodeURIComponent(slug);
        }
        const token = localStorage.getItem("token");
        // Se compara el valor RECORTADO: un token " null " o "null\n" tampoco
        // es una sesión, y aceptarlo deja la página corriendo sin sesión.
        const session = typeof token === "string" ? token.trim() : "";
        const usable = session !== "" && session !== "null" && session !== "undefined";
        if (usable) {
            return;
        }
    } catch (error) {
        // Sesión o slug ilegibles: redirigimos con lo que se pudo armar.
    }
    window.location.replace(target);
})();
</script>

</head>

<body class="kds-body">

	<div class="topbar">

		<div>KDS Cocina</div>

		<div class="topbar-right">

			<div id="clock">
				<div id="time"></div>
				<div id="date"></div>
			</div>

			<div id="logout" onclick="logout()">⏻</div>

		</div>

	</div>

	<div class="kanban">

		<div class="column">

			<div class="column-header new">
				Nuevos (<span id="countNew">0</span>)
			</div>

			<div id="newOrders" class="column-body"></div>

		</div>

		<div class="column">

			<div class="column-header preparing">
				Preparando (<span id="countPreparing">0</span>)
			</div>

			<div id="preparingOrders" class="column-body"></div>

		</div>

		<div class="column">

			<div class="column-header ready">
				Listos (<span id="countReady">0</span>)
			</div>

			<div id="readyOrders" class="column-body"></div>

		</div>

	</div>

	<audio id="newOrderSound">
		<source src="ding.mp3" type="audio/mpeg">
	</audio>
	<audio id="readySound">
		<source src="ready.mp3" type="audio/mpeg">
	</audio>

	<!-- Modal Cancelación Pedido -->
	<div id="cancelModal" class="modal hidden">
		<div class="modal-content">

			<h3>Cancelar pedido</h3>
			<p>Selecciona el motivo de la cancelación</p>

			<!-- Motivos -->
			<select id="cancelReason" class="input">
				<option value="">Seleccionar motivo</option>
			</select>

			<!-- Nota opcional -->
			<input type="text" id="cancelNote" class="input"
				placeholder="Observación (opcional)" />

			<div class="modal-buttons">
				<button class="btn btn-delivered" onclick="hideCancelModal()">
					No</button>

				<button class="btn btn-start" onclick="confirmCancelOrder()">
					Sí cancelar</button>
			</div>

		</div>
	</div>
	
	<div id="toastContainer" class="toast-container"></div>
	<script
		src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/stompjs@2/lib/stomp.min.js"></script>
	<script src="toast.js"></script>
	<script src="kds.js"></script>

</body>
</html>

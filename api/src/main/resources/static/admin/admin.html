<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDE Admin</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">

</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <h2 class="logo">SDE</h2>

        <nav>
            <button onclick="goTo('dashboard')">📊 Dashboard</button>
            <button onclick="goTo('products')">🍔 Productos</button>
            <button onclick="goTo('categories')">📂 Categorías</button>
            <button onclick="goTo('combos')">🔥 Combos</button>
        </nav>

        <button class="logout" onclick="logout()">🚪 Logout</button>
    </aside>

    <!-- MAIN -->
    <main class="main">

        <header class="topbar">
            <h1 id="view-title">Dashboard</h1>
            <button class="primary" onclick="openCreate()">+ Nuevo</button>
        </header>

        <section id="content"></section>

    </main>

</div>

<script src="admin.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carta Digital</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

	<div class="restaurant-header">

		<img id="restaurantLogo">

		<h1 id="restaurantName"></h1>

	</div>

	<header class="header">
		<h1>Menú</h1>
	</header>

	<div id="menu"></div>

	<div class="cart">

		<h2>Tu pedido</h2>

		<div id="cart-items"></div>

		<div class="cart-total">
			Total: $<span id="total">0</span>
		</div>

		<div class="order-form">

			<input id="customerName" type="text" placeholder="Nombre y Apellido">

			<select id="orderType">
				<option value="Retiro">Retiro en el local</option>
				<option value="Delivery">Delivery</option>
			</select>

			<div id="addressContainer">
				<input id="address" type="text"
					placeholder="Dirección (solo para delivery)">
			</div>

			<label>Forma de pago</label> <select id="paymentMethod">
				<option value="Efectivo">Efectivo</option>
				<option value="Transferencia">Transferencia</option>
			</select>

			<textarea id="notes"
				placeholder="Observaciones (ej: sin cebolla, sin mayonesa)">
</textarea>

		</div>

		<button id="sendOrder" class="whatsapp-btn">Pedir por
			WhatsApp</button>

	</div>

	<script src="app.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<link rel="stylesheet" href="dashboard.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
const token = localStorage.getItem("token");
if (!token) {
    window.location.href = "/login/login.html";
}

const payload = JSON.parse(atob(token.split(".")[1]));
const roles = payload.roles;

// Validación de rol
if (window.location.pathname.includes("/dashboard/") && !roles.includes("OWNER")) {
    window.location.href = "/login.html";
}
if (window.location.pathname.includes("/kds/") && !roles.includes("KITCHEN")) {
    window.location.href = "/login.html";
}
</script>

</head>

<body>

<header class="topbar">

<div class="title">
<h1 id="restaurantName">Dashboard</h1>
<span id="date"></span>
</div>

<div class="actions">
<button id="logoutBtn" onclick="logout()" class="logout-btn" title="Cerrar sesión">
<svg xmlns="http://www.w3.org/2000/svg"
     width="18"
     height="18"
     viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="2"
     stroke-linecap="round"
     stroke-linejoin="round">

  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
  <polyline points="16 17 21 12 16 7"/>
  <line x1="21" y1="12" x2="9" y2="12"/>

</svg>

<span>Salir</span>
</button>
</div>

</header>

<main>

<section class="stats">

<div class="stat-card">
<span>Pedidos hoy</span>
<h2 id="ordersToday">0</h2>
</div>

<div class="stat-card">
<span>Total vendido hoy</span>
<h2 id="revenueToday">$0</h2>
</div>

<div class="stat-card">
<span>Ticket promedio</span>
<h2 id="avgTicket">$0</h2>
</div>

<div class="stat-card">
<span>Tiempo cocina</span>
<h2 id="avgPrep">0m</h2>
</div>

</section>

<section class="orders-status">

<h2>Pedidos activos</h2>

<div class="status-grid">

<div class="status-card">
<span>Nuevos</span>
<h3 id="newOrders">0</h3>
</div>

<div class="status-card">
<span>Preparando</span>
<h3 id="preparingOrders">0</h3>
</div>

<div class="status-card">
<span>Listos</span>
<h3 id="readyOrders">0</h3>
</div>

</div>

</section>

<section class="chart-section">

<h2>Ventas hoy</h2>

<div class="chart-container">
<canvas id="salesChart"></canvas>
</div>

</section>

<section class="top-products">

<h2>Top productos</h2>

<ul id="topProducts"></ul>

</section>

</main>

<script type="module" src="dashboard.js"></script>

</body>

</html>

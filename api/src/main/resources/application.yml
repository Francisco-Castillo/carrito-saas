server:
  port: 9090
  address: 0.0.0.0

spring:
  servlet:
    multipart:
      # Límite de subida de imágenes de producto (POST /api/products/{id}/image):
      # el servicio además valida 5 MB y los content types permitidos.
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: jdbc:postgresql://localhost:5432/carrito_db
    username: admin
    password: admin

  sql:
    init:
      # "always" porque el default ("embedded") se salta PostgreSQL: sin esto
      # schema.sql nunca corre y las tablas JDBC de analítica no existen.
      # El script es idempotente (IF NOT EXISTS) y cubre SOLO las tablas de
      # analítica; las tablas de entidades siguen siendo de Hibernate.
      mode: always

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # Re-enables Hibernate's pre-insert nullability check for columns mapped
        # nullable=false. Hibernate skips it by default when a Bean Validation
        # provider is on the classpath (it defers to @NotNull, which the
        # repository module cannot see, so a null slug would otherwise reach
        # the database silently).
        check_nullability: true

  jackson:
    serialization:
      indent-output: true

app:
  uploads:
    # Directorio base para imágenes de producto (POST /api/products/{id}/image).
    # En producción fijar UPLOADS_DIR a un volumen persistente: los archivos
    # viven FUERA del classpath y sobreviven al redeploy solo si el dir lo hace.
    dir: ${UPLOADS_DIR:./uploads}
  metrics:
    # Ventana (en días hacia atrás desde hoy) que agrega el job de métricas
    # (ProductMetricsScheduler → AggregateProductMetricsUseCaseImpl) sobre
    # product_daily_sales. Debe cubrir holgadamente los 14 días que leen las
    # tendencias (semana actual vs semana anterior); el default de 30 da margen.
    window-days: 30

# Public origin encoded into every printed QR. The local default only works on
# this machine: QR_PUBLIC_MENU_URL MUST be set to the real public origin for a
# QR to work off-device.
qr:
  public-menu-url: ${QR_PUBLIC_MENU_URL:http://localhost:9090}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
  metrics:
    tags:
      application: carrito-saas
  server:
    # Mismo puerto que la app: Render y cualquier reverse proxy hacen el
    # health check contra el puerto del servicio (PORT), no contra uno fijo.
    port: ${server.port}

logging:
  level:
    root: INFO
    com.carrito: DEBUG

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [business:%X{businessId:-}] [user:%X{userId:-}] [corr:%X{correlationId:-}] %-5level %logger{36} - %msg%n"

  file:
    name: logs/app.log

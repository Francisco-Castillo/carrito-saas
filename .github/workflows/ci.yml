name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start PostgreSQL (max_connections=300)
        # A `services:` container cannot receive postgres arguments: its
        # `options` are docker-create flags, where `-c` is `--cpu-shares`, not
        # a postgres option. The suite creates one pooled context per Spring
        # test context and outgrew the default 100 connections — the failure
        # that kept this job red since ed219bc ("too many clients already",
        # 8 context-load errors in ProductImageEndpointTests). See issue #72.
        run: |
          docker run -d --name postgres \
            -e POSTGRES_DB=carrito_db \
            -e POSTGRES_USER=admin \
            -e POSTGRES_PASSWORD=admin \
            -p 5432:5432 \
            postgres:17 postgres -c max_connections=300

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            docker exec postgres pg_isready -U admin -d carrito_db && exit 0
            sleep 2
          done
          echo "PostgreSQL did not become ready in time" >&2
          exit 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify
        # The `frontend` profile installs the frontend dependencies and builds
        # the SPA into the static classpath (generate-resources) before the
        # backend tests run, because the generated bundle is not versioned.
        run: mvn -B --no-transfer-progress -Pfrontend verify

      - name: Frontend contract tests
        # The three legacy Node contract runners (menu-app, page-guard,
        # frontend-origin) used to execute the vanilla files in vm sandboxes.
        # Those files no longer exist: the contracts now run against the React
        # sources with Vitest, see frontend/tests/. They pin the customer-facing
        # menu failure contract (missing slug / unloadable restaurant / failed
        # or malformed menu fetch all stop with a readable message), the session
        # guard and the login redirect chain (including dead tokens, blocked
        # storage and a missing roles claim), the first-screen menu behaviour
        # and the rule that no shipped client hardcodes the application origin.
        working-directory: frontend
        run: npm test
